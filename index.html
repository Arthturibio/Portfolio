<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="assets/css/styles.css" rel="stylesheet">
    <title>Portfólio</title>
</head>

<body>
    <!-- Cabeçalho -->
    <header class="header">
        <div class="logo">
            <img src="assets/images/testlogo.jpg" alt="logodosite">
        </div>

        <nav class="menu">
            <a href="#inicio">Inicio</a>
            <a href="#sobreMim">Sobre mim</a>
            <a href="#projetos">Projetos</a>
            <a href="#contatos">Contatos</a>
        </nav>
    </header>

    <!-- Conteúdo principal -->
    <main>
        <section id="inicio" class="content-panel inicio-panel">
            <div class="terminal" aria-label="Apresentação estilo fastfetch">
                <div class="terminal-command" id="terminal-command"><span class="terminal-prompt">portfolio:~$ </span><span
                        id="terminal-text"></span><span class="terminal-cursor" aria-hidden="true"></span></div>
                <div class="fastfetch" id="fastfetch" aria-live="polite" hidden>
                    <img class="fastfetch-image" src="assets/images/testlogo.jpg"
                        alt="Imagem de apresentação do portfólio">
                    <div class="fastfetch-info">
                        <div class="fastfetch-title" data-fastfetch-line>arthur@portfolio</div>
                        <div data-fastfetch-line><span class="fastfetch-label">Nome:</span> Arthur</div>
                        <div data-fastfetch-line><span class="fastfetch-label">Perfil:</span> Desenvolvedor em formação</div>
                        <div data-fastfetch-line><span class="fastfetch-label">Interesses:</span> Web, programação e tecnologia</div>
                        <div data-fastfetch-line><span class="fastfetch-label">Site:</span> Portfólio pessoal</div>
                    </div>
                </div>
                <section class="terminal-skills" id="terminal-skills" aria-label="Linguagens de programação" hidden>
                    <div class="skills-divider" aria-hidden="true"></div>
                    <h2 class="skills-heading">Linguagens</h2>
                    <div class="skills-list">
                        <div class="skill">

                            <span>HTML</span>
                        </div>
                        <div class="skill">
                            <svg viewBox="0 0 48 48" role="img" aria-label="CSS"><path fill="#1572b6" d="M7 4h34l-3.1 35L24 44 10.1 39z"/><path fill="#33a9dc" d="M24 41V7h13.3l-2.5 29z"/><path fill="#fff" d="M14 12h20l-.5 5H19l.4 5h13.7l-1.2 12L24 37l-7.8-3-.5-6h5l.3 2.5 3 .9 3.1-.9.4-4H15z"/></svg>
                            <span>CSS</span>
                        </div>
                        <div class="skill">
                            <svg viewBox="0 0 48 48" role="img" aria-label="JavaScript"><path fill="#f7df1e" d="M4 4h40v40H4z"/><path fill="#111" d="m25 34 3.1-1.9c.6 1.1 1.2 2 2.6 2 1.3 0 2.1-.5 2.1-1.3 0-.9-.8-1.3-2.2-2l-.8-.4c-2.4-1-4-2.3-4-5 0-2.5 1.9-4.4 4.9-4.4 2.1 0 3.7.7 4.8 2.7l-2.9 1.9c-.6-1-1.1-1.4-1.9-1.4s-1.3.5-1.3 1.1c0 .8.5 1.2 1.8 1.8l.8.4c2.8 1.2 4.4 2.5 4.4 5.2 0 3-2.4 4.6-5.7 4.6-3.2 0-5.2-1.5-6.2-3.3M12 34.2l3-1.8c.6 1 1.1 1.8 2.3 1.8 1 0 1.6-.4 1.6-2.1v-11h3.7v11c0 3.8-2.2 5.5-5.2 5.5-2.8 0-4.4-1.4-5.4-3.4"/></svg>
                            <span>JavaScript</span>
                        </div>
                        <div class="skill">
                            <svg viewBox="0 0 48 48" role="img" aria-label="PHP"><path fill="#777bb3" d="M24 7C12 7 3 13 3 21s9 14 21 14 21-6 21-14S36 7 24 7"/><path fill="#fff" d="m11 28 2.5-14h6c4 0 5 2 4.4 5.3-.6 3.2-2.5 5-6.2 5h-2l-.7 3.7zm5.3-6.8h1.2c1.5 0 2.3-.7 2.6-2.1.3-1.5-.2-2-1.6-2h-1.4zm8.1 6.8 2.5-14h3.5l-.7 4h1.8c3.5 0 4.7 1.4 4.1 4.6L35 28h-3.6l.7-4.1c.3-1.5 0-1.8-1.3-1.8h-1.6l-1 5.9z"/></svg>
                            <span>PHP</span>
                        </div>
                        <div class="skill">
                            <svg viewBox="0 0 48 48" role="img" aria-label="C"><path fill="#659ad2" d="M40 13 24 4 8 13v22l16 9 16-9z"/><path fill="#fff" d="M31.5 29c-1.4 2.2-3.7 3.5-6.6 3.5-5.1 0-8.6-3.5-8.6-8.5s3.5-8.5 8.6-8.5c2.9 0 5.2 1.3 6.6 3.5l-4 2.3c-.6-1-1.4-1.6-2.7-1.6-2.2 0-3.6 1.7-3.6 4.3s1.4 4.3 3.6 4.3c1.3 0 2.1-.6 2.7-1.6z"/></svg>
                            <span>C</span>
                        </div>
                        <div class="skill">
                            <svg viewBox="0 0 48 48" role="img" aria-label="C sharp"><path fill="#68217a" d="M24 3 43 14v20L24 45 5 34V14z"/><path fill="#fff" d="M20.4 30.5c-1 .6-2.2.9-3.7.9-4.7 0-7.6-3.1-7.6-7.5s3-7.5 7.8-7.5c1.4 0 2.6.3 3.5.8v3.5c-.9-.8-2-1.2-3.3-1.2-2.6 0-4.2 1.8-4.2 4.4 0 2.5 1.5 4.3 4.1 4.3 1.3 0 2.5-.5 3.4-1.3zm2.3-6.8h2l.3-2.1h2l-.3 2.1h1.8l.3-2.1h2l-.3 2.1h1.7v1.8h-2l-.3 2h1.8v1.8h-2l-.3 2h-2l.3-2h-1.8l-.3 2h-2l.3-2h-1.7v-1.8h2l.3-2h-1.8zm3.7 1.8-.3 2h1.8l.3-2z"/></svg>

                        </div>
                        <div class="skill">
                            <svg viewBox="0 0 48 48" role="img" aria-label="MySQL"><path fill="#00758f" d="M24 6c-10 0-18 4-18 9v18c0 5 8 9 18 9s18-4 18-9V15c0-5-8-9-18-9"/><path fill="#f29111" d="M6 15c0 5 8 9 18 9s18-4 18-9"/><path fill="none" stroke="#fff" stroke-width="2" d="M12 18v13m6-11v13m6-10v13m6-16v13m6-15v12"/></svg>

                    </div>
                </section>
            </div>
        </section>
    </main>

    <script src="assets/java%20script/terminal.js" defer></script>

</body>

</html>
